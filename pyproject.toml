[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fasta-aa-extractor"
version = "1.0.0"
description = "Extract amino acid sequences from bacterial genomes using coordinate tables"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Vihaan", email = "your.email@example.com"}
]
keywords = ["bioinformatics", "genomics", "proteins", "fasta", "extraction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.6"
dependencies = [
    "biopython>=1.81",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/FastaAAExtractor"
Repository = "https://github.com/yourusername/FastaAAExtractor"
Issues = "https://github.com/yourusername/FastaAAExtractor/issues"
Documentation = "https://github.com/yourusername/FastaAAExtractor#readme"

[project.scripts]
fasta_aa_extractor = "fasta_aa_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"